const LOCALE = { en: 'en-IN', te: 'te-IN', kn: 'kn-IN', hi: 'hi-IN' };

const app = document.getElementById('app');
const link = new URLSearchParams(location.search).get('p') || '';
const storeKey = 'pgmeal_' + link;

function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

// Language: saved choice, else the phone's language, else English.
let lang = read('pgmeal_lang');
if (!T[lang]) {
  const nav = (navigator.languages || [navigator.language || 'en']).map(l => String(l).slice(0, 2));
  lang = nav.find(l => T[l]) || 'en';
}
function t(key, vars) {
  let s = (T[lang] && T[lang][key]) ?? T.en[key] ?? key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replace('{' + k + '}', v);
  return s;
}

// A random ID for this phone, so wrong tries lock only this phone (not the real guest's).
let deviceId = read('pgmeal_device');
if (!deviceId) {
  deviceId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
  store('pgmeal_device', deviceId);
}

let memToken = null; // fallback when the browser blocks storage
const token = () => read(storeKey) || memToken;
function setToken(v) { store(storeKey, v); memToken = v; }

async function rpc(fn, body) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const text = await r.text();
  const data = text ? JSON.parse(text) : null;
  if (!r.ok) throw new Error((data && data.message) || 'Could not reach the server. Check your internet and try again.');
  return data;
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function dayName(iso, isToday) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const loc = LOCALE[lang] || 'en-IN';
  const dm = dt.toLocaleDateString(loc, { day: 'numeric', month: 'short' });
  return isToday ? `${t('today')}, ${dm}` : dt.toLocaleDateString(loc, { weekday: 'short', day: 'numeric', month: 'short' });
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function langBar() {
  return `<nav class="langs" aria-label="Language">${LANGS.map(([code, name]) =>
    `<button type="button" data-lang="${code}" aria-pressed="${code === lang}" lang="${code}">${name}</button>`).join('')}</nav>`;
}
function wireLangBar(rerender) {
  app.querySelectorAll('button[data-lang]').forEach(b => b.onclick = () => {
    lang = b.dataset.lang; store('pgmeal_lang', lang); document.documentElement.lang = lang; rerender();
  });
}
document.documentElement.lang = lang;

// A different "don't waste food" note every day (same note for everyone on the same day).
function todayTip() {
  const now = new Date();
  const dayNo = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);
  const tips = t('tips');
  const [ico, text] = tips[dayNo % tips.length];
  return `<div class="tip daily" role="note"><div class="ico" aria-hidden="true">${ico}</div>
    <div><b>${t('todaysNote')}</b><p>${esc(text)}</p></div></div>`;
}
function ownerTip(note) {
  if (!note) return '';
  return `<div class="tip owner" role="note"><div class="ico" aria-hidden="true">📢</div>
    <div><b>${t('ownerNote')}</b><p>${esc(note)}</p></div></div>`;
}

// ---------- Step 1: who are you? ----------
let loginData = null; // { rooms, note, message }
async function showLogin(message) {
  if (!link) {
    app.innerHTML = `${langBar()}<h1>${t('linkMissing')}</h1><p class="sub">${t('openFull')}</p>`;
    wireLangBar(() => showLogin(message)); return;
  }
  if (!loginData) {
    app.innerHTML = '<div class="spinner" aria-label="Loading"></div>';
    try {
      const [rooms, info] = await Promise.all([rpc('vote_rooms', { p_link: link }), rpc('vote_note', { p_link: link })]);
      loginData = { rooms, note: info && info.note };
    } catch (e) {
      app.innerHTML = `${langBar()}<h1>${t('cantOpen')}</h1><div class="msg">${esc(e.message)}</div>`;
      wireLangBar(() => showLogin(message)); return;
    }
  }
  renderLogin(message);
}

function renderLogin(message, keep) {
  const byRoom = {};
  loginData.rooms.forEach(r => { (byRoom[r.room_no] ||= { floor: r.floor, beds: [] }).beds.push(r.bed_label); });
  const floors = {};
  Object.entries(byRoom).forEach(([no, v]) => { (floors[v.floor] ||= []).push(no); });
  const roomOptions = Object.keys(floors).sort((a, b) => a - b).map(f =>
    `<optgroup label="${f == 0 ? t('ground') : t('floor', { n: f })}">${floors[f].map(no => `<option>${esc(no)}</option>`).join('')}</optgroup>`
  ).join('');
  app.innerHTML = `
    ${langBar()}
    <h1>${t('welcome')}</h1>
    <p class="sub">${t('firstTime')}</p>
    ${ownerTip(loginData.note)}
    ${todayTip()}
    <div class="card">
      <label class="f" for="room">${t('yourRoom')}</label>
      <select id="room"><option value="">${t('chooseRoom')}</option>${roomOptions}</select>
      <label class="f" for="bed">${t('yourBed')}</label>
      <select id="bed" disabled><option value="">${t('chooseRoomFirst')}</option></select>
      <label class="f" for="l4">${t('last4')}</label>
      <input id="l4" class="t" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••">
      <div id="lmsg">${message ? `<div class="msg">${esc(message)}</div>` : ''}</div>
      <button id="go" class="btn all">${t('cont')}</button>
    </div>
    <p class="note">${t('phoneSaved')}</p>`;
  const roomEl = document.getElementById('room'), bedEl = document.getElementById('bed'), l4El = document.getElementById('l4');
  const fillBeds = () => {
    const r = byRoom[roomEl.value];
    bedEl.disabled = !r;
    bedEl.innerHTML = r ? r.beds.map(b => `<option>${esc(b)}</option>`).join('') : `<option value="">${t('chooseRoomFirst')}</option>`;
  };
  roomEl.onchange = fillBeds;
  if (keep) { roomEl.value = keep.room; fillBeds(); bedEl.value = keep.bed; l4El.value = keep.l4; }
  wireLangBar(() => renderLogin(message, { room: roomEl.value, bed: bedEl.value, l4: l4El.value }));
  document.getElementById('go').onclick = async () => {
    const l4 = l4El.value.replace(/\D/g, '');
    const lmsg = document.getElementById('lmsg');
    if (!roomEl.value || !bedEl.value || l4.length !== 4) {
      lmsg.innerHTML = `<div class="msg">${t('fillAll')}</div>`; return;
    }
    const btn = document.getElementById('go'); btn.disabled = true; btn.textContent = t('checking');
    try {
      const res = await rpc('vote_login', { p_link: link, p_room: roomEl.value, p_bed: bedEl.value, p_last4: l4, p_device: deviceId });
      if (!res.ok) { lmsg.innerHTML = `<div class="msg">${esc(res.message)}</div>`; btn.disabled = false; btn.textContent = t('cont'); return; }
      setToken(res.token);
      await showMeals();
    } catch (e) { lmsg.innerHTML = `<div class="msg">${esc(e.message)}</div>`; btn.disabled = false; btn.textContent = t('cont'); }
  };
}

// ---------- Step 2: meals ----------
let state = null;
async function showMeals() {
  if (!token()) return showLogin();
  if (!state) app.innerHTML = '<div class="spinner" aria-label="Loading"></div>';
  try { state = await rpc('vote_get', { p_token: token() }); }
  catch (e) { setToken(null); state = null; return showLogin(e.message); }
  render();
}

function render() {
  const s = state;
  const days = s.days.map(d => {
    const pill = !d.staying ? `<span class="pill lock">${t('notStaying')}</span>`
      : d.is_today || !d.open ? `<span class="pill lock">${t('locked')}</span>`
      : d.replied ? `<span class="pill ok">${t('replied')}</span>`
      : `<span class="pill wait">${t('notReplied')}</span>`;
    const canEdit = d.staying && d.open && !d.is_today;
    const rows = d.meals.map(m => `
      <div class="row">
        <div class="meal">${t(m.meal)}<small>${m.eating ? t('eating') : t('skipping')}</small></div>
        <label class="sw" aria-label="${t(m.meal)}, ${dayName(d.date, d.is_today)}">
          <input type="checkbox" data-date="${d.date}" data-meal="${m.meal}" ${m.eating ? 'checked' : ''} ${canEdit ? '' : 'disabled'}>
          <span></span>
        </label>
      </div>`).join('');
    const allEating = d.meals.every(m => m.eating);
    const allBtn = !canEdit ? ''
      : d.replied && allEating ? `<button class="btn all done" data-all="${d.date}">${t('allDone')}</button>`
      : !allEating ? `<button class="btn all ghost" data-all="${d.date}">${t('allBack')}</button>`
      : `<button class="btn all" data-all="${d.date}">${t('allTap')}</button>`;
    return `<section class="card" aria-label="${dayName(d.date, d.is_today)}">
      <div class="day-head"><div class="day-title">${dayName(d.date, d.is_today)}</div>${pill}</div>
      ${rows}${allBtn}</section>`;
  }).join('');
  app.innerHTML = `
    ${langBar()}
    <h1>${t('hi', { name: esc(s.name) })}</h1>
    <p class="sub">${esc(s.pg_name)} · ${t('room')} ${esc(s.room)}-${esc(s.bed)}<br>
      ${t('howTo', { cutoff: `<b>${esc(s.cutoff)}</b>` })}</p>
    ${ownerTip(s.note)}
    ${todayTip()}
    ${days}
    <p class="center"><button class="link" id="notme">${t('notMe', { name: esc(s.name) })}</button></p>`;
  wireLangBar(render);

  app.querySelectorAll('input[type=checkbox]').forEach(el => el.onchange = async () => {
    const eating = el.checked;
    el.disabled = true;
    try {
      state = await rpc('vote_set', { p_token: token(), p_date: el.dataset.date, p_meal: el.dataset.meal, p_eating: eating });
      render();
      toast(t('saved'));
    } catch (e) { el.checked = !eating; el.disabled = false; toast(e.message); }
  });
  app.querySelectorAll('button[data-all]').forEach(btn => btn.onclick = async () => {
    btn.disabled = true;
    try {
      state = await rpc('vote_all', { p_token: token(), p_date: btn.dataset.all });
      render();
      toast(t('thanks'));
    } catch (e) { btn.disabled = false; toast(e.message); }
  });
  document.getElementById('notme').onclick = async () => {
    try { await rpc('vote_logout', { p_token: token() }); } catch (e) {}
    setToken(null); state = null; loginData = null; showLogin();
  };
}

showMeals();
</script>
